name: Update Jadwal Salat Bulanan (Manual Cadangan)

on:
  workflow_dispatch: # Cadangan manual agar tidak duplikat dengan update-data.yml

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan scraper
        run: python data/main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update data JSON ($(date '+%Y-%m-%d'))" || echo "No changes"
          git push
